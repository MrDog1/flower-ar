<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JoJo model preview (no camera)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>html,body{margin:0;height:100%;background:#222}</style>
      <script src="./giorno.js?v=5"></script>
  </head>
  <body>
    <!-- Camera-less preview of the model for checking scale/orientation/animation. -->
    <a-scene vr-mode-ui="enabled: false" background="color: #333">
      <a-assets><a-asset-item id="m" src="./models/giorno.glb"></a-asset-item></a-assets>
      <a-entity light="type: ambient; intensity: 1.1"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
      <a-plane rotation="-90 0 0" width="1" height="1" color="#fff" opacity="0.4"></a-plane>
      <a-entity id="giorno" gltf-model="#m" scale="0.5 0.5 0.5" giorno-fix></a-entity>
      <a-entity camera look-controls position="0 0.55 1.8"></a-entity>
    </a-scene>
    <script>
    </script>
  </body>
</html>
