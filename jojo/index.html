<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JoJo AR - Giorno (Golden Wind)</title>
    <script defer src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script defer src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* Fixed body creates a stacking context so AR.js's z-index:-2 camera <video> stays above the black body background. */
      body { position: fixed; inset: 0; }
      /* AR.js rewrites inline width/height/margin of body, <video> and canvas every frame
         (leaving half the phone screen black). Author !important beats inline styles. */
      html, body { width: 100% !important; height: 100% !important; margin: 0 !important; }
      body { position: fixed !important; inset: 0 !important; }
      video, canvas.a-canvas {
        position: fixed !important; left: 0 !important; top: 0 !important;
        width: 100vw !important; height: 100vh !important; height: 100dvh !important;
        margin: 0 !important; transform: none !important; object-fit: contain; pointer-events: none;
      }
      video { z-index: -2 !important; background: #000; }
      canvas.a-canvas { z-index: -1 !important; }
      a-scene { position: fixed !important; inset: 0 !important; }
      #loading {
        position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #000; color: #f2c94c;
        font: italic 900 clamp(30px, 9vw, 52px)/1.1 'Arial Black', Impact, sans-serif; letter-spacing: 1px;
        transition: opacity 0.4s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
      #loading .sub { font: 14px/1.4 sans-serif; font-style: normal; font-weight: 400; color: #fff; opacity: 0.85; }
      #loading .bar { width: min(70vw, 320px); height: 10px; border: 2px solid #f2c94c; border-radius: 8px; overflow: hidden; }
      #loading .bar > i { display: block; height: 100%; width: 8%; background: linear-gradient(90deg, #fff200, #ff2d95); transition: width 0.5s; }
      #status {
        position: fixed; z-index: 20; left: 12px; right: 12px;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        max-width: 420px; padding: 10px 14px; border-radius: 12px;
        background: rgba(0, 0, 0, 0.78); color: #f2c94c;
        font: 14px/1.45 'Segoe UI', 'Yu Gothic UI', sans-serif;
      }
      #bubble {
        position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: min(88vw, 460px);
        padding: 14px 18px; border: 3px solid #f2c94c; border-radius: 14px;
        background: rgba(0, 0, 0, 0.82); color: #fff; text-align: center;
        font: italic 700 clamp(17px, 5vw, 24px)/1.4 Georgia, 'Times New Roman', serif;
        display: none;
      }
      #credit {
        position: fixed; z-index: 20; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
        font: 10px/1.4 sans-serif; color: rgba(255, 255, 255, 0.7); max-width: 90vw;
      }
      #credit a { color: inherit; }
    </style>
      <script defer src="./giorno.js?v=5"></script>
  </head>
  <body>
    <div id="loading">
      <div>Now loading<span class="dots"></span></div>
      <div class="bar"><i id="loading-bar"></i></div>
      <div class="sub" id="loading-sub">Downloading AR engine…</div>
    </div>
    <div id="status">Starting camera… Point it at the black-framed QR marker</div>
    <div id="bubble"><span id="line"></span></div>
    <div id="credit">
      3D model: “Giorno Giovanna &amp; gold experience” by shamus (@consistent_models),
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> via
      <a href="https://sketchfab.com/3d-models/giorno-giovanna-gold-experience-39f6d565da584521b7b5939fadb76dbb">Sketchfab</a>.
      JoJo's Bizarre Adventure &copy; Hirohiko Araki / Shueisha. Unofficial fan work.
    </div>

    <canvas id="pop-canvas" width="1024" height="320" style="display:none"></canvas>
    <a-scene
      vr-mode-ui="enabled: false;"
      embedded
      renderer="alpha: true; logarithmicDepthBuffer: true; precision: medium;"
      arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; patternRatio: 0.8;"
    >

      <a-marker id="marker" type="pattern" url="./markers/jojo-marker.patt" emitevents="true"
                smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
        <!-- "stage" lies back toward the viewer (-82deg = almost flat, face up) so the front is easy to see
             when the phone is held above the marker. Giorno and the photo frame share this tilt. -->
        <a-entity id="stage" position="-0.3 0 0.6" rotation="-82 0 0" scale="0.75 0.75 0.75">
          <a-entity id="giorno" giorno-fix></a-entity>

          <!-- Floating gold picture frame holding the cropped face photo, beside Giorno -->
          <a-entity id="photo-frame" position="0.8 1.2 0.15" rotation="0 -12 0"
                    animation="property: position; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true; to: 0.8 1.33 0.25">
            <a-box width="0.8" height="1.0" depth="0.07" material="color: #d4af37; metalness: 0.6; roughness: 0.35"></a-box>
            <a-plane id="photo" width="0.66" height="0.82" position="0 0 0.04" material="shader: flat"></a-plane>
          </a-entity>


          <!-- Pop-style "Hi! Jun!" sign right below the photo frame (texture drawn on a canvas, see script) -->
          <a-plane id="pop-text" width="0.85" height="0.27" position="0.75 0.55 0.2" rotation="0 -12 0"
                   material="shader: flat; transparent: true"
                   animation__bounce="property: position; dir: alternate; dur: 600; easing: easeInOutQuad; loop: true; to: 0.75 0.62 0.2"
                   animation__pulse="property: scale; dir: alternate; dur: 600; easing: easeInOutQuad; loop: true; to: 1.08 1.08 1.08"></a-plane>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => { // deferred scripts (A-Frame, AR.js) have run by now
      // ===== Joke extras: set to false (or open the page with ?fun=off) to remove them =====
      const FUN = { photo: true, text: true };
      if (new URLSearchParams(location.search).get("fun") === "off") { FUN.photo = false; FUN.text = false; }
      if (FUN.photo) document.getElementById("photo").setAttribute("material", "src", "./images/face.jpg");
      else document.getElementById("photo-frame").remove();
      // Pop-style "Hi! Jun!" texture (outline + shadow + gradient + sparkles) drawn on a canvas.
      const drawPop = () => {
        const c = document.getElementById("pop-canvas"), g = c.getContext("2d");
        const T = "Hi! Jun!";
        g.clearRect(0, 0, c.width, c.height);
        g.font = "italic 900 190px 'Arial Black', Impact, 'Trebuchet MS', sans-serif";
        g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
        const x = c.width / 2, y = c.height / 2 + 6;
        g.lineWidth = 34; g.strokeStyle = "#00d5ff"; g.strokeText(T, x + 12, y + 12);
        g.lineWidth = 34; g.strokeStyle = "#2b0a4f"; g.strokeText(T, x, y);
        g.lineWidth = 14; g.strokeStyle = "#ffffff"; g.strokeText(T, x, y);
        const grad = g.createLinearGradient(0, 60, 0, 260);
        grad.addColorStop(0, "#fff200"); grad.addColorStop(1, "#ff2d95");
        g.fillStyle = grad; g.fillText(T, x, y);
        g.fillStyle = "#fff"; g.font = "bold 70px sans-serif";
        [[70, 60], [960, 250], [930, 50], [90, 262]].forEach(([sx, sy]) => g.fillText("✦", sx, sy));
      };
      if (FUN.text) { drawPop(); document.getElementById("pop-text").setAttribute("material", "src", "#pop-canvas"); }
      else document.getElementById("pop-text").remove();
      // ======================================================================================

      const loadingEl = document.getElementById("loading");
      const setLoading = (pct, text) => {
        document.getElementById("loading-bar").style.width = pct + "%";
        document.getElementById("loading-sub").textContent = text;
      };
      let loadingDone = false;
      const finishLoading = () => {
        if (loadingDone) return;
        loadingDone = true;
        loadingEl.classList.add("done");
        setTimeout(() => loadingEl.remove(), 500);
      };
      setLoading(40, "Starting camera…");
      setTimeout(finishLoading, 30000); // never trap the user behind the loading screen
      const status = document.getElementById("status");
      const marker = document.getElementById("marker");
      // Giorno's line from the fight against Ghiaccio (White Album), Part 5. Unofficial fan translation.
      const LINE = "Resolve is... to carve a path forward through the dark wasteland!";
      const bubble = document.getElementById("bubble");
      const lineEl = document.getElementById("line");
      let typeTimer = null;
      const showLine = () => {
        clearInterval(typeTimer);
        bubble.style.display = "block";
        lineEl.textContent = "";
        let i = 0;
        typeTimer = setInterval(() => {
          lineEl.textContent = LINE.slice(0, ++i);
          if (i >= LINE.length) clearInterval(typeTimer);
        }, 45);
      };
      const hideLine = () => {
        clearInterval(typeTimer);
        bubble.style.display = "none";
      };


      // The 3D model loads AFTER the camera starts (a-assets would block the camera until the 1.6MB GLB finished).
      const giornoEl = document.getElementById("giorno");
      let modelStarted = false;
      const startModel = () => {
        if (modelStarted) return;
        modelStarted = true;
        giornoEl.setAttribute("gltf-model", "./models/giorno.glb");
      };
      window.addEventListener("camera-init", () => { status.textContent = "Camera ready. Loading Giorno…"; setLoading(70, "Loading Giorno…"); startModel(); });
      marker.addEventListener("markerFound", startModel);
      window.addEventListener("load", () => setTimeout(startModel, 5000)); // fallback if camera-init is never seen
      giornoEl.addEventListener("model-loaded", () => { setLoading(100, "Ready!"); finishLoading(); if (!marker.object3D.visible) status.textContent = "Point the camera at the black-framed QR marker"; });
      window.addEventListener("camera-error", () => { finishLoading(); status.textContent = "Camera unavailable. Please allow camera access in your browser settings"; });
      marker.addEventListener("markerFound", () => { status.textContent = "Giorno appears!"; showLine(); });
      marker.addEventListener("markerLost", () => { status.textContent = "Point the camera at the black-framed QR marker"; hideLine(); });
      giornoEl.addEventListener("model-error", () => { finishLoading(); status.textContent = "Failed to load the 3D model"; });
      });
    </script>
  </body>
</html>
