<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JoJo AR - Giorno (Golden Wind)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* Fixed body creates a stacking context so AR.js's z-index:-2 camera <video> stays above the black body background. */
      body { position: fixed; inset: 0; }
      /* AR.js rewrites inline width/height/margin of body, <video> and canvas every frame
         (leaving half the phone screen black). Author !important beats inline styles. */
      html, body { width: 100% !important; height: 100% !important; margin: 0 !important; }
      body { position: fixed !important; inset: 0 !important; }
      video, canvas.a-canvas {
        position: fixed !important; left: 0 !important; top: 0 !important;
        width: 100vw !important; height: 100vh !important; height: 100dvh !important;
        margin: 0 !important; transform: none !important; object-fit: contain; pointer-events: none;
      }
      video { z-index: -2 !important; background: #000; }
      canvas.a-canvas { z-index: -1 !important; }
      a-scene { position: fixed !important; inset: 0 !important; }
      #status {
        position: fixed; z-index: 20; left: 12px; right: 12px;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        max-width: 420px; padding: 10px 14px; border-radius: 12px;
        background: rgba(0, 0, 0, 0.78); color: #f2c94c;
        font: 14px/1.45 'Segoe UI', 'Yu Gothic UI', sans-serif;
      }
      #bubble {
        position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: min(88vw, 460px);
        padding: 14px 18px; border: 3px solid #f2c94c; border-radius: 14px;
        background: rgba(0, 0, 0, 0.82); color: #fff; text-align: center;
        font: italic 700 clamp(17px, 5vw, 24px)/1.4 Georgia, 'Times New Roman', serif;
        display: none; cursor: pointer;
      }
      #bubble small { display: block; margin-top: 6px; font: 11px/1.2 sans-serif; color: #f2c94c; font-style: normal; }
      #credit {
        position: fixed; z-index: 20; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
        font: 10px/1.4 sans-serif; color: rgba(255, 255, 255, 0.7); max-width: 90vw;
      }
      #credit a { color: inherit; }
    </style>
      <script src="./giorno.js?v=5"></script>
  </head>
  <body>
    <div id="status">Starting camera… Point it at the black-framed QR marker</div>
    <div id="bubble" role="button" aria-label="Hear Giorno's line"><span id="line"></span><small>Tap to hear it</small></div>
    <div id="credit">
      3D model: “Giorno Giovanna &amp; gold experience” by shamus (@consistent_models),
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> via
      <a href="https://sketchfab.com/3d-models/giorno-giovanna-gold-experience-39f6d565da584521b7b5939fadb76dbb">Sketchfab</a>.
      JoJo's Bizarre Adventure &copy; Hirohiko Araki / Shueisha. Unofficial fan work.
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      embedded
      renderer="alpha: true; logarithmicDepthBuffer: true; precision: medium;"
      arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; patternRatio: 0.8;"
    >

      <a-marker id="marker" type="pattern" url="./markers/jojo-marker.patt" emitevents="true"
                smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
        <!-- 1.76m tall model -> ~0.9 marker-units tall, standing on the marker -->
        <a-entity id="giorno" scale="0.75 0.75 0.75" position="0 0 0.6" rotation="-70 0 0"
                  giorno-fix></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const status = document.getElementById("status");
      const marker = document.getElementById("marker");
      // Giorno's line from the fight against Ghiaccio (White Album), Part 5. Unofficial fan translation.
      const LINE = "Resolve is... to carve a path forward through the dark wasteland!";
      const bubble = document.getElementById("bubble");
      const lineEl = document.getElementById("line");
      let typeTimer = null;
      const showLine = () => {
        clearInterval(typeTimer);
        bubble.style.display = "block";
        lineEl.textContent = "";
        let i = 0;
        typeTimer = setInterval(() => {
          lineEl.textContent = LINE.slice(0, ++i);
          if (i >= LINE.length) clearInterval(typeTimer);
        }, 45);
      };
      const hideLine = () => {
        clearInterval(typeTimer);
        bubble.style.display = "none";
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      };
      const speakLine = () => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(LINE);
        u.lang = "en-US"; u.rate = 0.9; u.pitch = 0.8;
        window.speechSynthesis.speak(u);
      };
      bubble.addEventListener("click", speakLine);

      // The 3D model loads AFTER the camera starts (a-assets would block the camera until the 1.6MB GLB finished).
      const giornoEl = document.getElementById("giorno");
      let modelStarted = false;
      const startModel = () => {
        if (modelStarted) return;
        modelStarted = true;
        giornoEl.setAttribute("gltf-model", "./models/giorno.glb");
      };
      window.addEventListener("camera-init", () => { status.textContent = "Camera ready. Loading Giorno…"; startModel(); });
      marker.addEventListener("markerFound", startModel);
      window.addEventListener("load", () => setTimeout(startModel, 5000)); // fallback if camera-init is never seen
      giornoEl.addEventListener("model-loaded", () => { if (!marker.object3D.visible) status.textContent = "Point the camera at the black-framed QR marker"; });
      window.addEventListener("camera-error", () => { status.textContent = "Camera unavailable. Please allow camera access in your browser settings"; });
      marker.addEventListener("markerFound", () => { status.textContent = "Giorno appears!"; showLine(); });
      marker.addEventListener("markerLost", () => { status.textContent = "Point the camera at the black-framed QR marker"; hideLine(); });
      giornoEl.addEventListener("model-error", () => { status.textContent = "Failed to load the 3D model"; });
    </script>
  </body>
</html>
