<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JoJo AR - Giorno (Golden Wind)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      a-scene { position: fixed !important; inset: 0 !important; }
      #status {
        position: fixed; z-index: 20; left: 12px; right: 12px;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        max-width: 420px; padding: 10px 14px; border-radius: 12px;
        background: rgba(0, 0, 0, 0.78); color: #f2c94c;
        font: 14px/1.45 'Segoe UI', 'Yu Gothic UI', sans-serif;
      }
      #credit {
        position: fixed; z-index: 20; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
        font: 10px/1.4 sans-serif; color: rgba(255, 255, 255, 0.7); max-width: 90vw;
      }
      #credit a { color: inherit; }
    </style>
      <script src="./giorno.js?v=5"></script>
  </head>
  <body>
    <div id="status">カメラを起動中… 黒枠のQRマーカーを映してください</div>
    <div id="credit">
      3D model: “Giorno Giovanna &amp; gold experience” by shamus (@consistent_models),
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> via
      <a href="https://sketchfab.com/3d-models/giorno-giovanna-gold-experience-39f6d565da584521b7b5939fadb76dbb">Sketchfab</a>.
      JoJo's Bizarre Adventure &copy; Hirohiko Araki / Shueisha. Unofficial fan work.
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      embedded
      renderer="alpha: true; logarithmicDepthBuffer: true; precision: medium;"
      arjs="trackingMethod: best; sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; patternRatio: 0.8;"
    >
      <a-assets timeout="20000">
        <a-asset-item id="giorno-model" src="./models/giorno.glb"></a-asset-item>
      </a-assets>

      <a-marker id="marker" type="pattern" url="./markers/jojo-marker.patt" emitevents="true"
                smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
        <!-- 1.76m tall model -> ~0.9 marker-units tall, standing on the marker -->
        <a-entity id="giorno" gltf-model="#giorno-model" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0"
                  giorno-fix></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Plays the first embedded animation clip in a loop.

      const status = document.getElementById("status");
      const marker = document.getElementById("marker");
      marker.addEventListener("markerFound", () => { status.textContent = "ジョルノ登場！"; });
      marker.addEventListener("markerLost", () => { status.textContent = "黒枠のQRマーカーを映してください"; });
      document.getElementById("giorno-model").addEventListener("error", () => { status.textContent = "モデルの読み込みに失敗しました"; });
    </script>
  </body>
</html>
