<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D Model AR Adjuster (位置・角度・サイズ調整ツール)</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- giorno.js (JoJo Giorno pose fix) -->
  <script src="./giorno.js?v=7"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #1a1a1e;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    a-scene {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      inset: 0 !important;
    }

    /* Floating Control Panel */
    #panel {
      position: fixed;
      top: 12px;
      right: 12px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      background: rgba(20, 20, 26, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    #panel.minimized {
      transform: translateY(-85%);
      opacity: 0.7;
    }
    #panel.minimized:hover {
      opacity: 1;
    }

    .panel-header {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .panel-header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #f2c94c;
      letter-spacing: 0.5px;
    }

    .toggle-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .panel-content {
      padding: 12px 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Model Status Banner */
    #status-banner {
      background: rgba(242, 201, 76, 0.15);
      border: 1px solid rgba(242, 201, 76, 0.4);
      color: #f2c94c;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    #status-banner.error {
      background: rgba(255, 82, 82, 0.15);
      border-color: rgba(255, 82, 82, 0.5);
      color: #ff5252;
    }
    #status-banner.success {
      background: rgba(105, 240, 174, 0.15);
      border-color: rgba(105, 240, 174, 0.5);
      color: #69f0ae;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ctrl-row {
      display: grid;
      grid-template-columns: 20px 1fr 62px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .ctrl-row label {
      font-weight: bold;
    }
    .ctrl-row label.x { color: #ff5252; }
    .ctrl-row label.y { color: #69f0ae; }
    .ctrl-row label.z { color: #40c4ff; }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #444;
      accent-color: #f2c94c;
      cursor: pointer;
    }

    input[type="number"] {
      background: #111;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      padding: 3px 4px;
      font-size: 11px;
      text-align: right;
      font-family: monospace;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #f2c94c;
    }

    .btn-row {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      background: #2b2b36;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .btn:hover {
      background: #3c3c4c;
      border-color: #f2c94c;
      color: #f2c94c;
    }
    .btn.primary {
      background: #f2c94c;
      color: #111;
      border-color: #f2c94c;
      font-size: 12px;
      padding: 8px;
    }
    .btn.primary:hover {
      background: #ffe066;
    }

    /* Output Box */
    .output-box {
      background: #0d0d12;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-family: Consolas, monospace;
      font-size: 10px;
      color: #a5d6a7;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.35;
    }

    /* Guide Badge */
    #guide-badge {
      position: fixed;
      left: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #bbb;
      pointer-events: none;
      z-index: 50;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    #guide-badge strong { color: #f2c94c; }

    /* Toast */
    #toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.88);
      color: #69f0ae;
      border: 1px solid #69f0ae;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #toast.show {
      opacity: 1;
    }

    /* File input hidden */
    #file-input { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 3D Scene -->
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true; colorManagement: true;"
      background="color: #222228"
    >
      <!-- Lights -->
      <a-entity light="type: ambient; intensity: 1.4"></a-entity>
      <a-entity light="type: directional; intensity: 1.0" position="2 4 3"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="-2 2 -2"></a-entity>

      <!-- Camera Rig (Look around / Rotate) -->
      <a-entity id="camera-rig" position="0 0.8 2.0">
        <a-entity id="main-camera" camera look-controls="pointerLockEnabled: false"></a-entity>
      </a-entity>

      <!-- Ground / Marker Simulation (1m x 1m AR Marker) -->
      <a-plane
        id="marker-ground"
        position="0 0 0"
        rotation="-90 0 0"
        width="1"
        height="1"
        material="color: #111; roughness: 0.8"
      >
        <!-- Marker Frame Border -->
        <a-plane width="0.84" height="0.84" position="0 0 0.005" material="color: #fff"></a-plane>
        <a-plane width="0.64" height="0.64" position="0 0 0.01" material="color: #000"></a-plane>
        <!-- Direction Arrow to indicate Marker Top -->
        <a-triangle vertex-a="0 0.46 0.02" vertex-b="-0.08 0.36 0.02" vertex-c="0.08 0.36 0.02" material="color: #ff2d95; shader: flat"></a-triangle>
      </a-plane>

      <!-- Floor Grid around marker -->
      <a-grid position="0 -0.002 0" width="8" height="8" depth="8" material="color: #444; opacity: 0.4"></a-grid>

      <!-- The Target 3D Model Stage -->
      <a-entity id="target-model-root" position="0.135 0 0.89" rotation="-82 0 0" scale="0.75 0.75 0.75">
        <!-- Placeholder Box (Shows immediately while loading) -->
        <a-box id="loading-box" position="0 0.6 0" width="0.3" height="1.2" depth="0.3" material="color: #f2c94c; wireframe: true"></a-box>

        <!-- The Giorno Model Entity -->
        <a-entity id="giorno-entity" giorno-fix></a-entity>

        <!-- Optional: Photo Frame Reference -->
        <a-entity id="photo-frame-preview" position="-0.175 1.0 -0.45" visible="true">
          <a-box width="1.0" height="0.06" depth="0.06" position="0 0.565 0" material="color: #d4af37"></a-box>
          <a-box width="1.0" height="0.06" depth="0.06" position="0 -0.565 0" material="color: #d4af37"></a-box>
          <a-box width="0.06" height="1.06" depth="0.06" position="-0.465 0 0" material="color: #d4af37"></a-box>
          <a-box width="0.06" height="1.06" depth="0.06" position="0.465 0 0" material="color: #d4af37"></a-box>
          <a-plane width="0.86" height="1.06" material="color: #333; shader: flat"></a-plane>
        </a-entity>
      </a-entity>

    </a-scene>

    <!-- Floating Control Panel -->
    <div id="panel">
      <div class="panel-header" id="panel-header">
        <h1>🛠️ 3D Model Adjuster</h1>
        <button class="toggle-btn" id="min-btn">最小化</button>
      </div>

      <div class="panel-content">
        <!-- Status / Load File -->
        <div id="status-banner">モデル読み込み中...</div>
        <input type="file" id="file-input" accept=".glb,.gltf">
        <div class="btn-row">
          <button class="btn" id="btn-file-select">📁 ローカルからGLBを選択</button>
          <button class="btn" id="btn-reload-model">🔄 再読込</button>
        </div>

        <!-- Scale -->
        <div class="section-title">
          <span>大きさ (Scale)</span>
          <span id="scale-val" style="color:#f2c94c; font-family:monospace;">0.75</span>
        </div>
        <div class="ctrl-group">
          <div class="ctrl-row">
            <label>S</label>
            <input type="range" id="scale-slider" min="0.05" max="3.0" step="0.01" value="0.75">
            <input type="number" id="scale-num" min="0.01" max="10.0" step="0.01" value="0.75">
          </div>
        </div>

        <!-- Position -->
        <div class="section-title">位置 (Position) [X, Y, Z]</div>
        <div class="ctrl-group">
          <div class="ctrl-row">
            <label class="x">X</label>
            <input type="range" id="pos-x-slider" min="-2.0" max="2.0" step="0.005" value="0.135">
            <input type="number" id="pos-x-num" step="0.005" value="0.135">
          </div>
          <div class="ctrl-row">
            <label class="y">Y</label>
            <input type="range" id="pos-y-slider" min="-1.0" max="2.0" step="0.005" value="0">
            <input type="number" id="pos-y-num" step="0.005" value="0">
          </div>
          <div class="ctrl-row">
            <label class="z">Z</label>
            <input type="range" id="pos-z-slider" min="-2.0" max="2.0" step="0.005" value="0.89">
            <input type="number" id="pos-z-num" step="0.005" value="0.89">
          </div>
        </div>

        <!-- Rotation -->
        <div class="section-title">角度 (Rotation) [度]</div>
        <div class="ctrl-group">
          <div class="ctrl-row">
            <label class="x">X</label>
            <input type="range" id="rot-x-slider" min="-180" max="180" step="1" value="-82">
            <input type="number" id="rot-x-num" step="1" value="-82">
          </div>
          <div class="ctrl-row">
            <label class="y">Y</label>
            <input type="range" id="rot-y-slider" min="-180" max="180" step="1" value="0">
            <input type="number" id="rot-y-num" step="1" value="0">
          </div>
          <div class="ctrl-row">
            <label class="z">Z</label>
            <input type="range" id="rot-z-slider" min="-180" max="180" step="1" value="0">
            <input type="number" id="rot-z-num" step="1" value="0">
          </div>
        </div>

        <!-- Presets -->
        <div class="section-title">プリセット / 表示切替</div>
        <div class="btn-row">
          <button class="btn" id="btn-preset-tilt">見上げ (-82°)</button>
          <button class="btn" id="btn-preset-up">直立 (0°)</button>
          <button class="btn" id="btn-preset-flat">上向き (-90°)</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btn-toggle-frame">額縁表示: ON</button>
          <button class="btn" id="btn-reset">初期化</button>
        </div>

        <!-- Camera Controls -->
        <div class="section-title">カメラ視点</div>
        <div class="btn-row">
          <button class="btn" id="cam-front">正面</button>
          <button class="btn" id="cam-top">真上</button>
          <button class="btn" id="cam-side">横</button>
          <button class="btn" id="cam-far">引き</button>
        </div>

        <!-- Output HTML snippet -->
        <div class="section-title">コード出力</div>
        <div class="output-box" id="output-code">&lt;a-entity id="stage" position="0.135 0 0.89" rotation="-82 0 0" scale="0.75 0.75 0.75"&gt;</div>
        
        <button class="btn primary" id="btn-copy">📋 設定タグをコピー</button>
      </div>
    </div>

    <!-- Usage Guide -->
    <div id="guide-badge">
      <strong>🖱️ 操作方法:</strong><br>
      ・画面ドラッグ: 視点回転<br>
      ・下部ボタン「カメラ視点」で視点変更<br>
      ・中央の四角がARマーカーの原点です
    </div>

    <!-- Toast Notification -->
    <div id="toast">クリップボードにコピーしました！</div>
  </div>

  <script>
    const target = document.getElementById("target-model-root");
    const giornoEl = document.getElementById("giorno-entity");
    const loadingBox = document.getElementById("loading-box");
    const statusBanner = document.getElementById("status-banner");
    const outputCode = document.getElementById("output-code");
    const toast = document.getElementById("toast");
    const panel = document.getElementById("panel");
    const minBtn = document.getElementById("min-btn");
    const panelHeader = document.getElementById("panel-header");
    const fileInput = document.getElementById("file-input");
    const photoFrame = document.getElementById("photo-frame-preview");
    const camRig = document.getElementById("camera-rig");

    // Inputs
    const posXSlider = document.getElementById("pos-x-slider");
    const posXNum = document.getElementById("pos-x-num");
    const posYSlider = document.getElementById("pos-y-slider");
    const posYNum = document.getElementById("pos-y-num");
    const posZSlider = document.getElementById("pos-z-slider");
    const posZNum = document.getElementById("pos-z-num");

    const rotXSlider = document.getElementById("rot-x-slider");
    const rotXNum = document.getElementById("rot-x-num");
    const rotYSlider = document.getElementById("rot-y-slider");
    const rotYNum = document.getElementById("rot-y-num");
    const rotZSlider = document.getElementById("rot-z-slider");
    const rotZNum = document.getElementById("rot-z-num");

    const scaleSlider = document.getElementById("scale-slider");
    const scaleNum = document.getElementById("scale-num");
    const scaleVal = document.getElementById("scale-val");

    // State (default to current index.html stage settings)
    const state = {
      pos: { x: 0.135, y: 0, z: 0.89 },
      rot: { x: -82, y: 0, z: 0 },
      scale: 0.75
    };

    function updateTarget() {
      target.setAttribute("position", `${state.pos.x} ${state.pos.y} ${state.pos.z}`);
      target.setAttribute("rotation", `${state.rot.x} ${state.rot.y} ${state.rot.z}`);
      target.setAttribute("scale", `${state.scale} ${state.scale} ${state.scale}`);

      scaleVal.textContent = state.scale.toFixed(2);
      
      const snippet = `<a-entity id="stage"\n  position="${state.pos.x} ${state.pos.y} ${state.pos.z}"\n  rotation="${state.rot.x} ${state.rot.y} ${state.rot.z}"\n  scale="${state.scale} ${state.scale} ${state.scale}">`;
      outputCode.textContent = snippet;
    }

    function bindControl(slider, num, getter, setter, isInt = false) {
      const apply = (val) => {
        const parsed = isInt ? parseInt(val, 10) || 0 : parseFloat(val) || 0;
        slider.value = parsed;
        num.value = parsed;
        setter(parsed);
        updateTarget();
      };
      slider.addEventListener("input", (e) => apply(e.target.value));
      num.addEventListener("input", (e) => apply(e.target.value));
    }

    bindControl(posXSlider, posXNum, () => state.pos.x, (v) => state.pos.x = v);
    bindControl(posYSlider, posYNum, () => state.pos.y, (v) => state.pos.y = v);
    bindControl(posZSlider, posZNum, () => state.pos.z, (v) => state.pos.z = v);

    bindControl(rotXSlider, rotXNum, () => state.rot.x, (v) => state.rot.x = v, true);
    bindControl(rotYSlider, rotYNum, () => state.rot.y, (v) => state.rot.y = v, true);
    bindControl(rotZSlider, rotZNum, () => state.rot.z, (v) => state.rot.z = v, true);

    bindControl(scaleSlider, scaleNum, () => state.scale, (v) => state.scale = v);

    function syncInputs() {
      posXSlider.value = posXNum.value = state.pos.x;
      posYSlider.value = posYNum.value = state.pos.y;
      posZSlider.value = posZNum.value = state.pos.z;

      rotXSlider.value = rotXNum.value = state.rot.x;
      rotYSlider.value = rotYNum.value = state.rot.y;
      rotZSlider.value = rotZNum.value = state.rot.z;

      scaleSlider.value = scaleNum.value = state.scale;
      updateTarget();
    }

    // Model Loading logic
    function setStatus(msg, type = "info") {
      statusBanner.textContent = msg;
      statusBanner.className = type;
    }

    function loadModelPath(path) {
      setStatus("モデル読み込み中... (" + path + ")", "info");
      loadingBox.setAttribute("visible", "true");
      
      // Directly set gltf-model on entity
      giornoEl.setAttribute("gltf-model", path);
    }

    giornoEl.addEventListener("model-loaded", () => {
      setStatus("✅ モデル読み込み成功！", "success");
      loadingBox.setAttribute("visible", "false");
    });

    giornoEl.addEventListener("model-error", (e) => {
      console.error("GLTF load error:", e);
      if (location.protocol === "file:") {
        setStatus("⚠️ file:// 直接開きのためブラウザ制限でブロックされました。「ローカルからGLBを選択」ボタンを押して giorno.glb を選択してください", "error");
      } else {
        setStatus("❌ モデル読み込みエラー。ファイルパスを確認してください", "error");
      }
    });

    // Local file selector (works even on file:/// protocol!)
    document.getElementById("btn-file-select").addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const blobUrl = URL.createObjectURL(file);
        setStatus("ファイル読込中: " + file.name, "info");
        loadModelPath(blobUrl);
      }
    });

    document.getElementById("btn-reload-model").addEventListener("click", () => {
      loadModelPath("./models/giorno.glb?t=" + Date.now());
    });

    // Presets
    document.getElementById("btn-preset-tilt").addEventListener("click", () => {
      state.pos = { x: 0.135, y: 0, z: 0.89 };
      state.rot = { x: -82, y: 0, z: 0 };
      state.scale = 0.75;
      syncInputs();
    });

    document.getElementById("btn-preset-up").addEventListener("click", () => {
      state.pos = { x: 0, y: 0, z: 0 };
      state.rot = { x: 0, y: 0, z: 0 };
      syncInputs();
    });

    document.getElementById("btn-preset-flat").addEventListener("click", () => {
      state.pos = { x: 0, y: 0, z: 0 };
      state.rot = { x: -90, y: 0, z: 0 };
      syncInputs();
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      state.pos = { x: 0, y: 0, z: 0 };
      state.rot = { x: 0, y: 0, z: 0 };
      state.scale = 0.5;
      syncInputs();
    });

    // Toggle photo frame
    let showFrame = true;
    document.getElementById("btn-toggle-frame").addEventListener("click", (e) => {
      showFrame = !showFrame;
      photoFrame.setAttribute("visible", showFrame);
      e.target.textContent = showFrame ? "額縁表示: ON" : "額縁表示: OFF";
    });

    // Camera presets
    document.getElementById("cam-front").addEventListener("click", () => {
      camRig.setAttribute("position", "0 0.8 2.0");
      camRig.setAttribute("rotation", "0 0 0");
    });
    document.getElementById("cam-top").addEventListener("click", () => {
      camRig.setAttribute("position", "0 3.0 0.1");
      camRig.setAttribute("rotation", "-80 0 0");
    });
    document.getElementById("cam-side").addEventListener("click", () => {
      camRig.setAttribute("position", "2.2 0.8 0.5");
      camRig.setAttribute("rotation", "0 70 0");
    });
    document.getElementById("cam-far").addEventListener("click", () => {
      camRig.setAttribute("position", "0 1.5 3.5");
      camRig.setAttribute("rotation", "-15 0 0");
    });

    // Copy to clipboard
    document.getElementById("btn-copy").addEventListener("click", () => {
      navigator.clipboard.writeText(outputCode.textContent).then(() => {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      });
    });

    // Minimize / Expand panel
    let isMin = false;
    const toggleMin = () => {
      isMin = !isMin;
      panel.classList.toggle("minimized", isMin);
      minBtn.textContent = isMin ? "展開" : "最小化";
    };
    minBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMin();
    });
    panelHeader.addEventListener("click", () => {
      if (isMin) toggleMin();
    });

    // Initial load
    syncInputs();
    window.addEventListener("DOMContentLoaded", () => {
      loadModelPath("./models/giorno.glb");
    });
  </script>
</body>
</html>
